version: 2
updates:
  - package-ecosystem: npm
    directory: /projects/ai-support-copilot/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /projects/ai-support-copilot/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /projects/ai-support-copilot
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
